<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 主底：静谧蓝灰（左上深 → 右下亮） -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="0.55" stop-color="#2c4258"/>
      <stop offset="1" stop-color="#5d7590"/>
    </linearGradient>
    <!-- 网格渐变光斑 -->
    <radialGradient id="glow1" cx="0.18" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#8fbdf0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8fbdf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.74" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#f0b294" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0b294" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.46" cy="1.1" r="0.8">
      <stop offset="0" stop-color="#3d6ba0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d6ba0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="0.94" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#d5e3f2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d5e3f2" stop-opacity="0"/>
    </radialGradient>
    <!-- 流动波带 -->
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fc3e8" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#e8b8a0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9fc3e8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- 底色 -->
  <rect width="1500" height="500" fill="url(#base)"/>
  <!-- 柔和光斑层 -->
  <rect width="1500" height="500" fill="url(#glow1)" filter="url(#soft)"/>
  <rect width="1500" height="500" fill="url(#glow2)" filter="url(#soft)"/>
  <rect width="1500" height="500" fill="url(#glow3)" filter="url(#soft)"/>
  <rect width="1500" height="500" fill="url(#glow4)" filter="url(#soft)"/>

  <!-- 流动波带（柔和曲线） -->
  <path d="M-60,320 C 260,225 520,425 820,340 C 1120,258 1330,365 1560,300 L1560,580 L-60,580 Z"
        fill="url(#wave1)" filter="url(#softer)"/>
  <path d="M-60,395 C 300,315 640,490 940,405 C 1180,338 1360,425 1560,382 L1560,600 L-60,600 Z"
        fill="url(#wave2)" filter="url(#softer)"/>
  <!-- 高光细线 -->
  <path d="M-60,255 C 220,185 500,330 760,265 C 1010,205 1240,300 1560,235"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2.5" filter="url(#softer)"/>
  <path d="M-60,455 C 300,395 640,520 940,460 C 1180,412 1360,480 1560,445"
        fill="none" stroke="#bcd4ec" stroke-opacity="0.1" stroke-width="2" filter="url(#softer)"/>
</svg>
